<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090B"/>
      <stop offset="100%" stop-color="#111418"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E0C7"/>
      <stop offset="100%" stop-color="#00A85A"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="22%" r="60%">
      <stop offset="0%" stop-color="rgba(0,224,199,0.25)"/>
      <stop offset="100%" stop-color="rgba(0,224,199,0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- 网格背景 -->
  <g stroke="#1A1D22" stroke-width="1" opacity="0.4">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Logo（左上） -->
  <g transform="translate(80, 80)">
    <path d="M64 8 L114 36 L114 92 L64 120 L14 92 L14 36 Z" fill="none" stroke="url(#brandGrad)" stroke-width="4" stroke-linejoin="round"/>
    <g stroke="url(#brandGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85">
      <path d="M40 42 L52 64 L40 86"/>
      <path d="M88 42 L76 64 L88 86"/>
    </g>
    <circle cx="64" cy="64" r="5" fill="url(#brandGrad)"/>
  </g>

  <text x="220" y="105" fill="#E8ECEF" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="28" font-weight="700">同行实验室</text>
  <text x="220" y="135" fill="#7C858E" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="3">TONGXING · LAB</text>

  <!-- 顶部状态徽章 -->
  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="240" height="40" rx="20" fill="#111418" stroke="#1A1D22"/>
    <circle cx="20" cy="20" r="5" fill="#00A85A"/>
    <circle cx="20" cy="20" r="5" fill="#00A85A" opacity="0.4">
      <animate attributeName="r" values="5;12;5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="26" fill="#A8B0B8" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="2">PE / VC · HARD TECH · 2026</text>
  </g>

  <!-- 主标题 -->
  <text x="80" y="340" fill="url(#brandGrad)" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="76" font-weight="900">和同行的人</text>
  <text x="80" y="420" fill="url(#brandGrad)" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="76" font-weight="900">走得更深一点。</text>

  <!-- 副标题 -->
  <text x="80" y="490" fill="#A8B0B8" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="22">PE/VC 投资人独立运营的研究与工具实验室</text>
  <text x="80" y="522" fill="#7C858E" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="22">AI · 半导体 · 新能源 · 机器人 · 二级市场</text>

  <!-- 底部标识 -->
  <line x1="80" y1="568" x2="1120" y2="568" stroke="#1A1D22"/>
  <text x="80" y="600" fill="#7C858E" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="2">tonghanglab.com</text>
  <text x="1120" y="600" text-anchor="end" fill="#7C858E" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="2">RESEARCH · HARNESS · COMMUNITY</text>
</svg>