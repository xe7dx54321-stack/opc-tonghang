<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E0C7" />
      <stop offset="100%" stop-color="#00A85A" />
    </linearGradient>
    <linearGradient id="brandGradSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E0C7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#00A85A" stop-opacity="0.85" />
    </linearGradient>
  </defs>
  <!-- 外框：六边形（实验室晶格感） -->
  <path
    d="M32 4 L57 18 L57 46 L32 60 L7 46 L7 18 Z"
    fill="none"
    stroke="url(#brandGrad)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />
  <!-- 内核：两个相向箭头（同行 = 并行共行） -->
  <g stroke="url(#brandGradSoft)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M22 22 L30 32 L22 42" />
    <path d="M42 22 L34 32 L42 42" />
  </g>
  <!-- 中心节点 -->
  <circle cx="32" cy="32" r="3" fill="url(#brandGrad)" />
</svg>